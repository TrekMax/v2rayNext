name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 jq shellcheck
      - name: Subscription integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax and focused lint
        run: |
          for file in v2ray.sh src/*.sh docker/*; do
            bash -n "$file"
          done
          shellcheck -S warning src/subscription.sh docker/*
      - name: Diff whitespace
        run: git diff --check
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build -t v2raynext:test .
      - name: Container startup and persistence tests
        env:
          V2RAY_DOCKER_IMAGE: v2raynext:test
        run: python3 -m unittest discover -s tests -p test_docker_integration.py -v
